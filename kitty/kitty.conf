# ============================================================
# KITTY CONFIGURATION
# ============================================================


# ------------------------------------------------------------
# Font
# ------------------------------------------------------------

font_family JetBrains Mono
font_size 12.0


# ------------------------------------------------------------
# Cursor
# ------------------------------------------------------------

cursor_shape block
cursor_blink_interval 0.5


# ------------------------------------------------------------
# Scrollback
# ------------------------------------------------------------

scrollback_lines 10000


# ------------------------------------------------------------
# Mouse
# ------------------------------------------------------------

copy_on_select no


# ------------------------------------------------------------
# Bell
# ------------------------------------------------------------

enable_audio_bell no

# Notify when a long-running command finishes outside the visible window.
notify_on_cmd_finish invisible 20.0


# ------------------------------------------------------------
# Adwaita dark colors
# ------------------------------------------------------------

foreground #f6f5f4
background #1e1e1e

# Subtle transparency
background_opacity 0.93

selection_foreground #1e1e1e
selection_background #f5c211

cursor #f5c211
cursor_text_color #1e1e1e
url_color #51a1ff

# Standard GNOME / Adwaita terminal palette
color0  #241f31
color1  #c01c28
color2  #2ec27e
color3  #f5c211
color4  #1e78e4
color5  #9841bb
color6  #0ab9dc
color7  #c0bfbc
color8  #5e5c64
color9  #ed333b
color10 #57e389
color11 #f8e45c
color12 #51a1ff
color13 #c061cb
color14 #4fd2fd
color15 #f6f5f4


# ------------------------------------------------------------
# Tabs
# ------------------------------------------------------------

tab_bar_edge top
tab_bar_style separator
tab_separator "  "
tab_title_template "{index}: {title}"

active_tab_foreground #f6f5f4
active_tab_background #3d3846
active_tab_font_style bold
inactive_tab_foreground #c0bfbc
inactive_tab_background #1e1e1e
inactive_tab_font_style normal
tab_bar_background #1e1e1e


# ------------------------------------------------------------
# Window / pane appearance
# ------------------------------------------------------------

# Open new Kitty OS windows at a compact, predictable height.
remember_window_size no
initial_window_height 24c

window_padding_width 8
window_border_width 1

active_border_color #f5c211
inactive_border_color #5e5c64

# A negative value dims only inactive panes, not a lone unfocused window.
inactive_text_alpha -0.85

# Retain GNOME's system-colored title bar on Wayland.
wayland_titlebar_color system


# ------------------------------------------------------------
# Layouts
# ------------------------------------------------------------

enabled_layouts splits,tall,stack


# ------------------------------------------------------------
# Pane creation
# ------------------------------------------------------------

# Horizontal split
map f5 launch --location=hsplit --cwd=current

# Vertical split
map f6 launch --location=vsplit --cwd=current


# ------------------------------------------------------------
# New tabs/windows inherit current working directory
# ------------------------------------------------------------

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
